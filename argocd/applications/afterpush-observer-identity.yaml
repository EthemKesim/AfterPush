apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: afterpush-observer-identity
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/EthemKesim/AfterPush.git
    targetRevision: main
    path: k8s/observer
    directory:
      include: argocd-reader-rbac.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
