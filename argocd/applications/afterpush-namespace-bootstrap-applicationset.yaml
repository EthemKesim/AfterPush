apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: afterpush-namespace-bootstrap
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
  - missingkey=error
  generators:
  - git:
      repoURL: https://github.com/EthemKesim/AfterPush.git
      revision: main
      directories:
      - path: gitops/platform/namespaces/*/*
  syncPolicy:
    preserveResourcesOnDeletion: true
  template:
    metadata:
      name: bootstrap-{{ index .path.segments 3 }}-{{ .path.path | sha256sum | trunc
        12 }}
    spec:
      project: afterpush-namespace-bootstrap
      source:
        repoURL: https://github.com/EthemKesim/AfterPush.git
        targetRevision: main
        path: '{{ .path.path }}'
        directory:
          recurse: false
          include: namespace.yaml
      destination:
        server: https://kubernetes.default.svc
        namespace: ap-{{ index .path.segments 3 }}-{{ index .path.segments 4 }}
      syncPolicy:
        automated:
          prune: false
          selfHeal: true
