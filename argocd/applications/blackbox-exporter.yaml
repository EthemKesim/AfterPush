apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: blackbox-exporter
  namespace: argocd

spec:
  project: default

  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: prometheus-blackbox-exporter
      targetRevision: 11.19.1
      helm:
        valueFiles:
          - $values/platform/addons/blackbox-exporter/values.yaml

    - repoURL: https://github.com/EthemKesim/AfterPush.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true