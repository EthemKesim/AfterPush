apiVersion: batch/v1
kind: CronJob
metadata:
  name: afterpush-runtime-reconciliation
  namespace: afterpush-system
spec:
  schedule: "*/5 * * * *"
  # Enable only after the image, database Secret, ConfigMap, and per-app
  # read-only Roles have been verified in the target cluster.
  suspend: true
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 180
      ttlSecondsAfterFinished: 3600
      template:
        spec:
          serviceAccountName: afterpush-runtime-worker
          automountServiceAccountToken: true
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: runtime-worker
              image: REPLACE_RUNTIME_WORKER_IMAGE
              imagePullPolicy: IfNotPresent
              command:
                - python
                - -m
                - afterpush_api.workers.deployment_runtime_reconciliation
                - --in-cluster
                - --limit
                - "20"
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: afterpush-api-db
                      key: DATABASE_URL
                - name: AFTERPUSH_GITOPS_REPOSITORY_URL
                  valueFrom:
                    configMapKeyRef:
                      name: afterpush-runtime-worker-config
                      key: AFTERPUSH_GITOPS_REPOSITORY_URL
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                readOnlyRootFilesystem: true
              volumeMounts:
                - name: temporary-files
                  mountPath: /tmp
          volumes:
            - name: temporary-files
              emptyDir: {}
