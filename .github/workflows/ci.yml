name: CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

jobs:
  build:
    name: Build and Validate
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint application
        run: npm run lint

      - name: Run application tests
        run: npm test

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Build TypeScript application
        run: npm run build

      - name: Build Docker image
        run: docker build -t afterpush-api:ci .

      - name: Scan Docker image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: afterpush-api:ci
          scan-type: image
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: false

      - name: Run Docker container
        run: |
          docker run -d \
            --name afterpush-api-test \
            -p 3000:3000 \
            afterpush-api:ci

      - name: Test health endpoint
        run: |
          echo "Waiting for application to start..."

          for i in {1..10}; do
            if curl --fail http://localhost:3000/health; then
              echo "Health check passed"
              exit 0
            fi

            echo "Application not ready yet. Retrying..."
            sleep 2
          done

          echo "Health check failed"
          docker logs afterpush-api-test
          exit 1

      - name: Stop test container
        if: always()
        run: docker rm -f afterpush-api-test