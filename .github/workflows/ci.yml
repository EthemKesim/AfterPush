name: CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

jobs:
  build:
    name: Build and Validate
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint application
        run: npm run lint

      - name: Run application tests
        run: npm test

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Build TypeScript application
        run: npm run build

      - name: Build Docker image
        run: docker build -t afterpush-api:ci .

      - name: Scan Docker image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: afterpush-api:ci
          scan-type: image
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: false

      - name: Run Docker container
        run: |
          docker run -d \
            --name afterpush-api-test \
            -p 3000:3000 \
            afterpush-api:ci

      - name: Test health endpoint
        run: |
          echo "Waiting for application to start..."

          for i in {1..10}; do
            if curl --fail http://localhost:3000/health; then
              echo "Health check passed"
              exit 0
            fi

            echo "Application not ready yet. Retrying..."
            sleep 2
          done

          echo "Health check failed"
          docker logs afterpush-api-test
          exit 1

      - name: Stop test container
        if: always()
        run: docker rm -f afterpush-api-test

  terraform:
    name: Terraform Validate
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.0"

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Initialize Terraform
        run: terraform init -backend=false

      - name: Validate Terraform configuration
        run: terraform validate

      - name: Scan Terraform configuration
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: terraform/
          severity: HIGH,CRITICAL
          exit-code: '0'

  platform:
    name: Platform Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: platform/pyproject.toml

      - name: Install platform dependencies
        run: python -m pip install -e "platform[dev]"

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: "v4.3.0"

      - name: Validate application configs
        run: |
          afterpush validate platform/examples/afterpush.yaml
          afterpush validate platform/examples/payments-api.yaml

      - name: Run platform tests
        run: python -m pytest platform/tests -v

      - name: Verify generated GitOps values
        run: |
          afterpush render platform/examples/afterpush.yaml > /tmp/afterpush-api-values.yaml
          afterpush render platform/examples/payments-api.yaml > /tmp/payments-api-values.yaml

          diff -u gitops/apps/afterpush-api/values.yaml /tmp/afterpush-api-values.yaml

      - name: Lint Helm applications
        run: |
          helm lint helm/afterpush -f gitops/apps/afterpush-api/values.yaml
          helm lint helm/afterpush -f /tmp/payments-api-values.yaml

      - name: Render Helm applications
        run: |
          helm template afterpush-api helm/afterpush \
            -f gitops/apps/afterpush-api/values.yaml \
            > /tmp/afterpush-api-rendered.yaml

          helm template payments-api helm/afterpush \
            -f /tmp/payments-api-values.yaml \
            > /tmp/payments-api-rendered.yaml
