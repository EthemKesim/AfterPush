name: CD - Build and Push to ECR

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-central-1
  ECR_API_REPOSITORY: afterpush-api
  ECR_RUNTIME_WORKER_REPOSITORY: afterpush-runtime-worker

jobs:
  build-and-push:
    name: Build and Push Image
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::833090513321:role/afterpush-github-actions-ecr
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: 833090513321

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push platform API image
        uses: docker/build-push-action@v7
        with:
          context: ./platform
          file: ./platform/Dockerfile.api
          platforms: linux/amd64
          push: true
          provenance: true
          sbom: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_API_REPOSITORY }}:${{ github.sha }}

      - name: Build and push runtime worker image
        uses: docker/build-push-action@v7
        with:
          context: ./platform
          file: ./platform/Dockerfile.runtime-worker
          platforms: linux/amd64
          push: true
          provenance: true
          sbom: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_RUNTIME_WORKER_REPOSITORY }}:${{ github.sha }}
