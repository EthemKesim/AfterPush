apiVersion: v1
kind: ServiceAccount
metadata:
  name: afterpush-publication-worker
  namespace: afterpush-system
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: afterpush-gitops-recovery
  namespace: afterpush-system
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: afterpush-publication-prerequisites-reader
rules:
  - apiGroups: [""]
    resources: ["namespaces", "resourcequotas", "limitranges"]
    verbs: ["get"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: afterpush-publication-prerequisites-reader
subjects:
  - kind: ServiceAccount
    name: afterpush-publication-worker
    namespace: afterpush-system
roleRef:
  kind: ClusterRole
  name: afterpush-publication-prerequisites-reader
  apiGroup: rbac.authorization.k8s.io
