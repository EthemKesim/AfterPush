apiVersion: v1
kind: ConfigMap
metadata:
  name: afterpush-gitops-worker-config
  namespace: afterpush-system
data:
  AFTERPUSH_GITOPS_REPOSITORY_URL: https://github.com/ORG/afterpush-gitops.git
---
apiVersion: v1
kind: Secret
metadata:
  name: afterpush-gitops-credentials
  namespace: afterpush-system
type: Opaque
stringData:
  AFTERPUSH_GITOPS_USERNAME: x-access-token
  AFTERPUSH_GITOPS_TOKEN: REPLACE_ME
