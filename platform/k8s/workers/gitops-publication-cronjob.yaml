apiVersion: batch/v1
kind: CronJob
metadata:
  name: afterpush-gitops-publication
  namespace: afterpush-system
  labels:
    app.kubernetes.io/name: afterpush
    app.kubernetes.io/component: gitops-publication
spec:
  schedule: "*/5 * * * *"
  suspend: true
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 180
      ttlSecondsAfterFinished: 3600
      template:
        spec:
          serviceAccountName: afterpush-publication-worker
          automountServiceAccountToken: true
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: publication-worker
              image: REPLACE_WORKER_IMAGE
              imagePullPolicy: IfNotPresent
              command:
                - python
                - -m
                - afterpush_api.workers.gitops_publication
              args:
                - --execute
                - --limit
                - "20"
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: afterpush-api-db
                      key: DATABASE_URL
                - name: AFTERPUSH_GITOPS_REPOSITORY_URL
                  valueFrom:
                    configMapKeyRef:
                      name: afterpush-gitops-worker-config
                      key: AFTERPUSH_GITOPS_REPOSITORY_URL
                - name: AFTERPUSH_GITOPS_USERNAME
                  valueFrom:
                    secretKeyRef:
                      name: afterpush-gitops-credentials
                      key: AFTERPUSH_GITOPS_USERNAME
                - name: AFTERPUSH_GITOPS_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: afterpush-gitops-credentials
                      key: AFTERPUSH_GITOPS_TOKEN
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
