apiVersion: v1
kind: Namespace
metadata:
  name: afterpush-system
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: afterpush-system
spec:
  clusterIP: None
  selector:
    app: afterpush-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: afterpush-postgres
  namespace: afterpush-system
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: afterpush-postgres
  template:
    metadata:
      labels:
        app: afterpush-postgres
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: postgres
          image: postgres:17
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              value: afterpush
            - name: POSTGRES_USER
              value: afterpush
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: afterpush-postgres-auth
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: gp3
        resources:
          requests:
            storage: 5Gi
