apiVersion: apps/v1
kind: Deployment
metadata:
  name: afterpush-platform-api
  namespace: afterpush-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: afterpush-platform-api
  template:
    metadata:
      labels:
        app: afterpush-platform-api
    spec:
      containers:
        - name: api
          image: REPLACE_IMAGE_URI
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: afterpush-api-db
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: afterpush-platform-api
  namespace: afterpush-system
spec:
  type: ClusterIP
  selector:
    app: afterpush-platform-api
  ports:
    - port: 8000
      targetPort: 8000
