
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "afterpush-platform"
version = "0.1.0"
description = "Self-service application platform for AfterPush"
requires-python = ">=3.12"
dependencies = [
    "PyYAML",
    "jsonschema",
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy>=2.0,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "alembic>=1.14,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
]

[project.scripts]
afterpush = "afterpush_cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = [
    "afterpush_cli*",
    "afterpush_engine*",
    "afterpush_api*",
]

[tool.setuptools.package-data]
afterpush_engine = ["schema/*.json"]
