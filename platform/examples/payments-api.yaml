apiVersion: afterpush.dev/v1
kind: Application

metadata:
  name: payments-api

spec:
  image:
    repository: payments-api
    tag: latest

  port: 3000

  health:
    path: /health

  ingress:
    enabled: true
    host: payments.local

  scaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilization: 50

  monitoring:
    enabled: true