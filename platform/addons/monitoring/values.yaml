crds:
  enabled: false

grafana:
  enabled: true

  service:
    type: ClusterIP

prometheus:
  enabled: true

  prometheusSpec:
    retention: 2d

alertmanager:
  enabled: true

kubeStateMetrics:
  enabled: true

nodeExporter:
  enabled: true

# kind control-plane components expose their metrics only on
# the node's localhost by default, so Prometheus cannot scrape them.
kubeControllerManager:
  enabled: false

kubeEtcd:
  enabled: false

kubeScheduler:
  enabled: false

kubeProxy:
  enabled: false
