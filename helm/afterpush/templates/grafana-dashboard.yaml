{{- if .Values.monitoring.enabled }}
apiVersion: v1
kind: ConfigMap

metadata:
  name: afterpush-grafana-dashboard
  labels:
    grafana_dashboard: "1"

data:
  afterpush-dashboard.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": false,
      "graphTooltip": 1,
      "panels": [
        {
          "type": "stat",
          "title": "Healthy AfterPush Targets",
          "id": 1,
          "gridPos": {
            "h": 6,
            "w": 8,
            "x": 0,
            "y": 0
          },
          "targets": [
            {
             "expr": "sum(up{namespace=\"{{ .Values.environment.namespace }}\", job=\"{{ .Values.application.name }}\"})",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": ["lastNotNull"],
              "values": false
            },
            "orientation": "auto",
            "textMode": "auto"
          }
        },
        {
          "type": "stat",
          "title": "HTTP 5xx Error Rate",
          "id": 2,
          "gridPos": {
            "h": 6,
            "w": 8,
            "x": 8,
            "y": 0
          },
          "targets": [
            {
              "expr": "100 * ((sum(rate(afterpush_http_requests_total{status_code=~\"5..\",route!=\"/health\"}[5m])) or vector(0)) / sum(rate(afterpush_http_requests_total{route!=\"/health\"}[5m])))",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": ["lastNotNull"],
              "values": false
            },
            "orientation": "auto",
            "textMode": "auto"
          }
        },
        {
          "type": "stat",
          "title": "p95 Latency",
          "id": 3,
          "gridPos": {
            "h": 6,
            "w": 8,
            "x": 16,
            "y": 0
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by (le) (rate(afterpush_http_request_duration_seconds_bucket{route!=\"/health\"}[5m])))",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": ["lastNotNull"],
              "values": false
            },
            "orientation": "auto",
            "textMode": "auto"
          }
        },
        {
          "type": "timeseries",
          "title": "Request Rate",
          "id": 4,
          "gridPos": {
            "h": 9,
            "w": 24,
            "x": 0,
            "y": 6
          },
          "targets": [
            {
              "expr": "sum(rate(afterpush_http_requests_total{route!=\"/health\"}[5m]))",
              "legendFormat": "AfterPush RPS",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "single"
            }
          }
        },
        {
          "type": "stat",
          "title": "SLO Success Rate",
          "id": 5,
          "description": "Successful user-request percentage derived from the 5-minute SLO error-rate recording rule.",
          "gridPos": {
            "h": 6,
            "w": 8,
            "x": 0,
            "y": 15
          },
          "targets": [
            {
              "expr": "100 * (1 - afterpush:slo_error_rate:5m)",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "decimals": 3,
              "min": 0,
              "max": 100,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 99.9
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": ["lastNotNull"],
              "values": false
            },
            "orientation": "auto",
            "textMode": "auto"
          }
        },
        {
          "type": "timeseries",
          "title": "Fast Error Budget Burn Rate",
          "id": 6,
          "description": "Burn rate used by the critical fast-burn SLO alert. The alert requires both 5m and 1h burn rates to exceed 14.4x.",
          "gridPos": {
            "h": 9,
            "w": 12,
            "x": 0,
            "y": 21
          },
          "targets": [
            {
              "expr": "afterpush:slo_burn_rate:5m",
              "legendFormat": "5m burn rate",
              "refId": "A"
            },
            {
              "expr": "afterpush:slo_burn_rate:1h",
              "legendFormat": "1h burn rate",
              "refId": "B"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 2,
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "type": "timeseries",
          "title": "Slow Error Budget Burn Rate",
          "id": 7,
          "description": "Burn rate used by the warning slow-burn SLO alert. The alert requires both 30m and 6h burn rates to exceed 6x.",
          "gridPos": {
            "h": 9,
            "w": 12,
            "x": 12,
            "y": 21
          },
          "targets": [
            {
              "expr": "afterpush:slo_burn_rate:30m",
              "legendFormat": "30m burn rate",
              "refId": "A"
            },
            {
              "expr": "afterpush:slo_burn_rate:6h",
              "legendFormat": "6h burn rate",
              "refId": "B"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 2,
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "type": "stat",
          "title": "Outside-In Availability",
          "id": 8,
          "description": "Blackbox probe result through the Kubernetes ingress path. UP means the application is reachable through ingress; DOWN means the probe failed.",
          "gridPos": {
            "h": 6,
            "w": 24,
            "x": 0,
            "y": 30
          },
          "targets": [
            {
              "expr": "probe_success{namespace=\"{{ .Values.environment.namespace }}\",job=\"afterpush-blackbox\"}",
              "legendFormat": "AfterPush availability",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "min": 0,
              "max": 1,
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "DOWN"
                    },
                    "1": {
                      "text": "UP"
                    }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": ["lastNotNull"],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "wideLayout": true
          }
        }
      ],
      "refresh": "10s",
      "schemaVersion": 42,
      "tags": [
        "afterpush",
        "observability",
        "slo",
        "sre",
        "blackbox"
      ],
      "templating": {
        "list": []
      },
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "timezone": "browser",
      "title": "AfterPush Observability",
      "uid": "afterpush-observability",
      "version": 4
    }
{{- end }}