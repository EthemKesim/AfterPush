{{- if .Values.monitoring.enabled }}
apiVersion: v1
kind: ConfigMap

metadata:
  name: afterpush-grafana-dashboard
  labels:
    grafana_dashboard: "1"

data:
  afterpush-dashboard.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": false,
      "graphTooltip": 1,
      "panels": [
        {
          "type": "stat",
          "title": "Healthy AfterPush Targets",
          "id": 1,
          "gridPos": {
            "h": 6,
            "w": 8,
            "x": 0,
            "y": 0
          },
          "targets": [
            {
              "expr": "sum(up{namespace=\"afterpush-dev\", job=\"afterpush-api\"})",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": ["lastNotNull"],
              "values": false
            },
            "orientation": "auto",
            "textMode": "auto"
          }
        },
        {
          "type": "stat",
          "title": "HTTP 5xx Error Rate",
          "id": 2,
          "gridPos": {
            "h": 6,
            "w": 8,
            "x": 8,
            "y": 0
          },
          "targets": [
            {
              "expr": "100 * sum(rate(afterpush_http_requests_total{status_code=~\"5..\",route!=\"/health\"}[5m])) / sum(rate(afterpush_http_requests_total{route!=\"/health\"}[5m]))",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": ["lastNotNull"],
              "values": false
            },
            "orientation": "auto",
            "textMode": "auto"
          }
        },
        {
          "type": "stat",
          "title": "p95 Latency",
          "id": 3,
          "gridPos": {
            "h": 6,
            "w": 8,
            "x": 16,
            "y": 0
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by (le) (rate(afterpush_http_request_duration_seconds_bucket{route!=\"/health\"}[5m])))",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": ["lastNotNull"],
              "values": false
            },
            "orientation": "auto",
            "textMode": "auto"
          }
        },
        {
          "type": "timeseries",
          "title": "Request Rate",
          "id": 4,
          "gridPos": {
            "h": 9,
            "w": 24,
            "x": 0,
            "y": 6
          },
          "targets": [
            {
              "expr": "sum(rate(afterpush_http_requests_total{route!=\"/health\"}[5m]))",
              "legendFormat": "AfterPush RPS",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "single"
            }
          }
        }
      ],
      "refresh": "10s",
      "schemaVersion": 42,
      "tags": [
        "afterpush",
        "observability"
      ],
      "templating": {
        "list": []
      },
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "timezone": "browser",
      "title": "AfterPush Observability",
      "uid": "afterpush-observability",
      "version": 1
    }
{{- end }}