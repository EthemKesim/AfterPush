
apiVersion: v1
kind: Service

metadata:
  name: {{ include "afterpush.resourceName" . }}
  labels:
    app: {{ include "afterpush.resourceName" . }}

spec:
  type: {{ .Values.service.type }}

  selector:
    app: {{ include "afterpush.resourceName" . }}

  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
