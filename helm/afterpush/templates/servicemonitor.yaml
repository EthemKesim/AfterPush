{{- if .Values.monitoring.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor

metadata:
  name: {{ include "afterpush.resourceName" . }}
  labels:
    release: monitoring

spec:
  selector:
    matchLabels:
      app: {{ include "afterpush.resourceName" . }}

  endpoints:
    - port: http
      path: /metrics
      interval: 15s

      relabelings:
        - targetLabel: application
          replacement: {{ include "afterpush.resourceName" . | quote }}

        - targetLabel: scrape_type
          replacement: "application"
{{- end }}