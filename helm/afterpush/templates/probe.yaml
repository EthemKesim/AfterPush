{{- if .Values.monitoring.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: Probe

metadata:
  name: {{ include "afterpush.resourceName" . }}-http
  labels:
    release: monitoring
    application: {{ include "afterpush.resourceName" . | quote }}

spec:
  jobName: {{ printf "%s-blackbox" (include "afterpush.resourceName" .) | quote }}

  interval: 15s

  module: afterpush_http_2xx

  prober:
    url: blackbox-exporter-prometheus-blackbox-exporter.monitoring.svc.cluster.local:9115

  targets:
    staticConfig:
      static:
        - {{ printf "http://%s.%s.svc.cluster.local:%v%s" (include "afterpush.resourceName" .) .Release.Namespace .Values.service.port .Values.probes.readiness.path | quote }}
      labels:
        application: {{ include "afterpush.resourceName" . | quote }}
{{- end }}