apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ include "afterpush.resourceName" . }}
  labels:
    app: {{ include "afterpush.resourceName" . }}
  {{- with .Values.deployment }}
  {{- if hasKey . "revision" }}
  annotations:
    afterpush.dev/revision: {{ .revision | toString | quote }}
  {{- end }}
  {{- end }}

spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}

  selector:
    matchLabels:
      app: {{ include "afterpush.resourceName" . }}

  template:
    metadata:
      labels:
        app: {{ include "afterpush.resourceName" . }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.deployment }}
        {{- if hasKey . "revision" }}
        afterpush.dev/revision: {{ .revision | toString | quote }}
        {{- end }}
        {{- end }}

    spec:
      serviceAccountName: {{ include "afterpush.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ include "afterpush.resourceName" . }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: {{ .Values.containerSecurity.readOnlyRootFilesystem }}
            capabilities:
              drop:
                - ALL

          ports:
            - containerPort: {{ .Values.service.targetPort }}

          envFrom:
            - configMapRef:
                name: {{ include "afterpush.resourceName" . }}-config

            {{- if .Values.secret.enabled }}
            - secretRef:
                name: {{ .Values.secret.name | default (printf "%s-secret" (include "afterpush.resourceName" .)) }}
            {{- end }}

          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: {{ .Values.service.targetPort }}
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}

          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: {{ .Values.service.targetPort }}
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}

          resources:
            requests:
              cpu: {{ .Values.resources.requests.cpu }}
              memory: {{ .Values.resources.requests.memory }}
            limits:
              cpu: {{ .Values.resources.limits.cpu }}
              memory: {{ .Values.resources.limits.memory }}
