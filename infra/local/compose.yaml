
services:
  postgres:
    image: postgres:17-alpine
    container_name: afterpush-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: afterpush
      POSTGRES_PASSWORD: afterpush_local_dev
      POSTGRES_DB: afterpush

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U afterpush -d afterpush"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
