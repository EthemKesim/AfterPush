application:
  name: afterpush-api
image:
  repository: 833090513321.dkr.ecr.eu-central-1.amazonaws.com/afterpush-api
  tag: temporary-eks-demo-dc5b434754
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 80
  targetPort: 8000
config:
  appEnv: eks
  logLevel: info
ingress:
  enabled: true
  className: alb
  annotations:
    # The platform API has no end-user authentication; keep the final EKS
    # profile reachable only from the VPC unless that security model changes.
    alb.ingress.kubernetes.io/scheme: internal
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /health
  host: ''
  path: /
  pathType: Prefix
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 50
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi
probes:
  readiness:
    path: /health
    initialDelaySeconds: 2
    periodSeconds: 5
  liveness:
    path: /health
    initialDelaySeconds: 5
    periodSeconds: 10
monitoring:
  enabled: false
serviceAccount:
  automountServiceAccountToken: false
containerSecurity:
  readOnlyRootFilesystem: true
